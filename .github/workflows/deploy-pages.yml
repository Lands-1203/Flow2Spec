name: Deploy website to GitHub Pages

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/deploy-pages.yml
      - docs/**
      - website/**
      - presentations/**
      - .claude/skills/html-ppt/assets/**
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    name: Build Astro website
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: website/package-lock.json

      - name: Install dependencies
        working-directory: website
        run: npm ci

      - name: Build website
        working-directory: website
        run: npm run build

      - name: Copy presentation decks into Pages artifact
        # 把仓内演示稿及其共享资源原样拷进 website/dist,保留仓内相对路径 `../../.claude/skills/html-ppt/assets/*`,
        # 使演示稿在 GitHub Pages 上和在仓内直接打开时表现一致,无需维护第二套路径。
        run: |
          set -euo pipefail
          mkdir -p website/dist/presentations
          cp -R presentations/flow2spec-intro-public website/dist/presentations/
          cp -R presentations/flow2spec-intro-public-en website/dist/presentations/
          mkdir -p website/dist/.claude/skills/html-ppt
          cp -R .claude/skills/html-ppt/assets website/dist/.claude/skills/html-ppt/

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: website/dist

  deploy:
    name: Deploy GitHub Pages
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
